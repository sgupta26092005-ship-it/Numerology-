
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Individual Month Cycle Calculator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f3f0ff;
    margin: 0;
    padding: 20px;
    color: #29243b;
}

.container {
    max-width: 650px;
    margin: auto;
}

.header {
    background: linear-gradient(135deg, #32116b, #7844b8);
    color: white;
    padding: 25px;
    border-radius: 16px;
    text-align: center;
}

.header h1 {
    margin-top: 0;
    font-size: 25px;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 14px;
    margin-top: 18px;
    box-shadow: 0 4px 15px #00000010;
}

label {
    display: block;
    margin-top: 14px;
    font-weight: bold;
}

input, button {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border: 1px solid #d4cbe8;
    border-radius: 8px;
    font-size: 16px;
}

button {
    background: #6636a5;
    color: white;
    border: none;
    margin-top: 20px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #4c2186;
}

#result {
    display: none;
    margin-top: 20px;
}

.number {
    font-size: 48px;
    text-align: center;
    color: #6636a5;
    font-weight: bold;
}

.result-title {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
}

.explanation {
    line-height: 1.8;
    color: #484052;
}

.note {
    color: #6c6478;
    font-size: 13px;
    line-height: 1.6;
}
</style>
</head>

<body>
<div class="container">

<div class="header">
    <h1>Individual Month Cycle</h1>
    <p>Discover the numerology interpretation of your current month</p>
</div>

<div class="card">
    <h2>Enter Your Details</h2>

    <label>Date of Birth</label>
    <input type="number" id="date" min="1" max="31"
           placeholder="e.g. 14">

    <label>Birth Month (1–12)</label>
    <input type="number" id="birthMonth" min="1" max="12"
           placeholder="e.g. 9">

    <label>Birth Year</label>
    <input type="number" id="birthYear" min="1"
           placeholder="e.g. 1962">

    <label>Current Month (1–12)</label>
    <input type="number" id="currentMonth" min="1" max="12"
           placeholder="e.g. 5">

    <label>Months After Last Birthday (0–11)</label>
    <input type="number" id="elapsed" min="0" max="11"
           placeholder="e.g. 8">

    <button onclick="calculate()">Calculate My Month Number</button>

    <p class="note">
        Enter the current month and the number of months elapsed
        since your most recent birthday.
    </p>

    <div id="result">
        <hr>
        <p id="calculation"></p>
        <div class="number" id="number"></div>
        <div class="result-title" id="title"></div>
        <p class="explanation" id="meaning"></p>
    </div>
</div>

</div>

<script>
const meanings = {
1: {
title: "New Beginnings and Leadership",
text: `This is a good month for new business enterprises,
new associations and new ideas. Concentrate on buying and
selling, advertising, publicity and creative work.

Number 1 represents the opening of a new cycle.
Individual initiative and independence are prominent.
Leadership and forcefulness can bring success and achievement.
New friendships may bring pleasure, social success and popularity.
The new strength arising within you can help revitalize your personality.`
},

2: {
title: "Cooperation and Relationships",
text: `This is a month for cooperation rather than starting
a completely new project. You may play the role of a
matchmaker or help reconcile people who have quarrelled.

Keep your temper balanced. A friendship may blossom into
romance or become a prosperous collaboration. Minor changes
in your routine may result from suggestions made by others.

You may find it difficult to make up your mind about an
important issue. If possible, postpone the decision until
the next month.`
},

3: {
title: "Expression, Creativity and Prosperity",
text: `Be careful not to squander your money, as the temptation
to gamble or take unnecessary risks may be strong.

You may gain prestige as a leader within your group.
Arts and literature can bring increased pleasure and appreciation.
Express yourself through words, communication and oratory.

This month encourages optimism and prosperity. Use your
creative abilities and communication skills constructively.`
},

4: {
title: "Hard Work and Building the Future",
text: `You have to work hard during this month. Focus on saving,
planning and building a strong foundation for the future.

Bring out the ideas you have been developing and express them
now, or prepare a campaign or project that may bear fruit
in the future.

Patience, discipline and consistent effort are important
for turning your plans into lasting achievements.`
},

5: {
title: "Change and Adjustment",
text: `This month represents a period of change and adjustment,
though some changes may be temporary.

Your home situation may experience minor changes.
Your employment situation may improve if you are ready
to accept advancement and new responsibilities.

Use your communication skills wisely, especially when
dealing with higher authorities. Remain flexible and
make the best of changing circumstances.`
},

6: {
title: "Responsibility, Education and Harmony",
text: `This cycle represents material supply and the lessons
of responsibility and unselfishness. You may not need to
worry excessively about your source of income, but you
may also need to share your resources and fulfil your duties.

Try to enhance the beauty of your surroundings.
This month is associated with enjoyment through decorative
arts and appreciation of beauty.

Adopt a realistic and mature attitude towards your tasks.
Find satisfaction in nature, beauty and the things
you appreciate in life.`
},

7: {
title: "Study, Reflection and Inner Wisdom",
text: `The serious aspects of life may appeal to you more
than temporary pleasures during this month.

You may find it easier to study yourself, your friends
and your surroundings with a calm and objective mind.
Use this opportunity to evaluate your life and let go
of things that are no longer worthwhile.

Broaden your field of study. Life, society, customs,
arts, crafts and vocational subjects can all provide
valuable lessons. Mystical studies may also interest you,
and you may enjoy exploring deeper questions about nature.`
},

8: {
title: "Power, Achievement and Prosperity",
text: `Power and energy are associated with the number 8 cycle.
Take responsibility for the affairs with which you are connected
and approach your work with confidence and determination.

Make achievement your aim for the month. This is a time
to demonstrate your abilities and work towards fulfilling
your potential.

Even during success and prosperity, remember those who
are less fortunate. Generosity and helping others can make
your achievements more meaningful.`
},

9: {
title: "Completion, Release and New Beginnings",
text: `This month is associated with letting go of habits,
thoughts and actions that may be holding back your progress.

Reconnect with people who live far away, as communication
may bring unexpected opportunities. You may feel drawn
to spiritual or mystical subjects and deeper self-reflection.

Trust your own judgement when considering personal problems.
Review what is no longer useful and prepare for the next cycle
with optimism and confidence.

Treat this as a period of completion, reflection and preparation
for a fresh beginning.`
}
};

function calculate() {
    const date = Number(document.getElementById("date").value);
    const birthMonth = Number(document.getElementById("birthMonth").value);
    const birthYear = Number(document.getElementById("birthYear").value);
    const currentMonth = Number(document.getElementById("currentMonth").value);
    const elapsed = Number(document.getElementById("elapsed").value);

    const validDate = new Date(birthYear, birthMonth - 1, date);

    if (
        !date || !birthMonth || !birthYear ||
        !currentMonth ||
        date < 1 || date > 31 ||
        birthMonth < 1 || birthMonth > 12 ||
        currentMonth < 1 || currentMonth > 12 ||
        !Number.isInteger(elapsed) ||
        elapsed < 0 || elapsed > 11 ||
        validDate.getFullYear() !== birthYear ||
        validDate.getMonth() !== birthMonth - 1 ||
        validDate.getDate() !== date
    ) {
        alert("Please enter valid details in all fields.");
        return;
    }

    const total = date + birthMonth + birthYear
                  + currentMonth + elapsed;

    let number = total;

    while (number > 9) {
        number = String(number)
            .split("")
            .reduce((sum, digit) => sum + Number(digit), 0);
    }

    document.getElementById("calculation").innerHTML =
        "<b>Calculation:</b> " + date + " + " +
        birthMonth + " + " + birthYear + " + " +
        currentMonth + " + " + elapsed + " = " + total;

    document.getElementById("number").textContent = number;
    document.getElementById("title").textContent =
        "Individual Month Number " + number +
        ": " + meanings[number].title;

    document.getElementById("meaning").textContent =
        meanings[number].text;

    document.getElementById("result").style.display = "block";
}
</script>

</body>
</html>
