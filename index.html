
<!DOCTYPE html>
<html>
<head>
    <title>Individual Month Cycle Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 20px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 12px;
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            margin-top: 20px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
            line-height: 1.8;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Individual Month Cycle</h2>

    <label>Date of Birth:</label>
    <input type="number" id="date" min="1" max="31"
           placeholder="Enter birth date">

    <label>Month of Birth (1-12):</label>
    <input type="number" id="birthMonth" min="1" max="12"
           placeholder="Enter birth month">

    <label>Year of Birth:</label>
    <input type="number" id="birthYear" min="1"
           placeholder="Enter birth year">

    <label>Current Month (1-12):</label>
    <input type="number" id="currentMonth" min="1" max="12"
           placeholder="Enter current month">

    <label>Months After Last Birthday:</label>
    <input type="number" id="elapsed" min="0" max="11"
           placeholder="Enter elapsed months">

    <button onclick="calculate()">Calculate</button>

    <div id="result"></div>
</div>

<script>
function calculate() {
    let date = Number(document.getElementById("date").value);
    let birthMonth = Number(document.getElementById("birthMonth").value);
    let birthYear = Number(document.getElementById("birthYear").value);
    let currentMonth = Number(document.getElementById("currentMonth").value);
    let elapsed = Number(document.getElementById("elapsed").value);

    if (!date || !birthMonth || !birthYear || !currentMonth ||
        date < 1 || date > 31 ||
        birthMonth < 1 || birthMonth > 12 ||
        currentMonth < 1 || currentMonth > 12 ||
        elapsed < 0 || elapsed > 11) {
        document.getElementById("result").innerHTML =
            "Please enter valid values in all fields.";
        return;
    }

    let total = date + birthMonth + birthYear +
                currentMonth + elapsed;

    let number = total;

    while (number > 9) {
        number = number.toString().split("")
            .reduce((sum, digit) => sum + Number(digit), 0);
    }

    document.getElementById("result").innerHTML =
        "Total: " + total +
        "<br>Individual Month Cycle Number: " + number;
}
</script>

</body>
</html>
